<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>basilisk docs</title>
    <meta name="description" content="Documentation for Basilisk, the Luau virtualizing obfuscator. Covers the BASIL_* macro system and CLI usage." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: oklch(0.18 0.004 80);
        --panel: oklch(0.205 0.004 80);
        --line: oklch(0.305 0.005 80);
        --line-strong: oklch(0.37 0.006 80);
        --fg: oklch(0.93 0.004 90);
        --fg-muted: oklch(0.72 0.006 85);
        --fg-subtle: oklch(0.65 0.006 85);
        --accent: #8fa8f5;
        --accent-ink: #8fa8f5;
        --accent-hover: #b3c3fa;
        --code-bg: oklch(0.198 0.004 80);
        --code-border: oklch(0.27 0.005 80);
        --ok-green: oklch(0.84 0.12 155);
        --mesh-rgb: 236 234 228;
        --mesh-accent-rgb: 143 168 245;
        --mesh-alpha: 0.26;
        --syn-fg: oklch(0.9 0.004 90);
        --syn-comment: oklch(0.6 0.008 85);
        --syn-keyword: oklch(0.79 0.12 300);
        --syn-string: oklch(0.8 0.1 150);
        --syn-number: oklch(0.79 0.12 60);
        --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
        --radius: 10px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * { box-sizing: border-box; }
      html {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 16px;
        scroll-behavior: smooth;
        scroll-padding-top: 1.5rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        font-size: 0.875rem;
        line-height: 1.75;
        font-variant-numeric: lining-nums tabular-nums;
        font-feature-settings: "calt" 0;
      }
      a { color: var(--accent-ink); }
      ::selection { background: color-mix(in oklab, var(--accent) 30%, transparent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

      .mesh {
        position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%;
        pointer-events: none; opacity: 0; transition: opacity 0.9s ease;
      }
      .mesh.is-ready { opacity: 1; }
      @media (max-width: 56rem) { .mesh { display: none; } }

      .wrap { width: min(100% - 2rem, 46rem); margin-inline: auto; }

      .site-header {
        display: flex; flex-wrap: wrap; gap: 0.6rem 1.5rem;
        align-items: center; justify-content: space-between;
        padding-block: 2rem 1.1rem;
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--line);
      }
      .brand { margin: 0; font-size: 1.05rem; line-height: 1; }
      .brand-link {
        display: inline-flex; align-items: center; gap: 0.6ch;
        color: var(--fg); text-decoration: none; font-weight: 600;
      }
      .brand-sword { flex: none; width: 1.15em; height: 1.15em; translate: 0 -0.04em; opacity: 0.95; }
      .brand-sub { color: var(--fg-subtle); font-weight: 400; }
      .brand-link:hover .brand-name { color: var(--accent-ink); }
      .site-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.5rem; font-size: 0.8125rem; }
      .site-nav a { color: var(--fg-muted); text-decoration: none; }
      .site-nav a:hover { color: var(--accent-ink); }

      main { flex: 1; }
      article { padding: 1rem 0 5rem; }
      article :where(h1, h2, h3, h4) {
        font-weight: 600; line-height: 1.3; letter-spacing: 0; scroll-margin-top: 1.5rem;
      }
      article h1 { font-size: 1.35rem; margin: 0 0 1rem; }
      article h2 {
        font-size: 1.05rem; margin: 2.75rem 0 1rem;
        padding-bottom: 0.4rem; border-bottom: 1px solid var(--line);
      }
      article h3 { font-size: 0.95rem; margin: 2rem 0 0.6rem; }
      article h4 { font-size: 0.9rem; margin: 1.6rem 0 0.5rem; color: var(--fg-muted); }
      article p, article li { color: var(--fg); }
      article a { text-decoration: none; }
      article a:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 0.18em; }
      article strong { color: var(--fg); font-weight: 600; }
      article ul, article ol { padding-left: 1.4em; }
      article li { margin-bottom: 0.3em; }
      article li::marker { color: var(--fg-subtle); }
      article :not(pre) > code {
        font-size: 0.82em;
        background: var(--panel);
        border: 1px solid var(--code-border);
        border-radius: 5px;
        padding: 0.08em 0.34em;
        overflow-wrap: anywhere;
      }
      article pre {
        margin: 1.25rem 0;
        background: var(--code-bg);
        border: 1px solid var(--code-border);
        border-radius: var(--radius);
        padding: 0.9rem 1.05rem;
        overflow-x: auto;
        line-height: 1.55;
        scrollbar-width: thin;
      }
      article pre code { font-size: 0.8rem; color: var(--syn-fg); }

      .code-block {
        position: relative;
        margin: 1.25rem 0;
        background: var(--code-bg);
        border: 1px solid var(--code-border);
        border-radius: var(--radius);
      }
      .code-block > pre {
        margin: 0;
        border: none;
        background: transparent;
        position: relative;
        z-index: 1;
      }
      .code-sel {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        border-radius: var(--radius);
      }
      .code-sel-rect {
        position: absolute;
        top: 0;
        left: 0;
        background: color-mix(in oklab, var(--accent) 28%, transparent);
        border-radius: 2px;
      }
      .code-block ::selection { background: transparent; }
      .code-block ::-moz-selection { background: transparent; }
      .code-copy {
        position: absolute;
        top: 0.45rem;
        right: 0.45rem;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.7rem;
        height: 1.7rem;
        padding: 0;
        color: var(--fg-subtle);
        background: color-mix(in oklab, var(--code-bg) 80%, transparent);
        border: 1px solid var(--code-border);
        border-radius: 6px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.14s var(--ease-out), color 0.14s, border-color 0.14s;
      }
      .code-block:hover .code-copy,
      .code-copy:focus-visible { opacity: 1; }
      .code-copy:hover { color: var(--fg); border-color: var(--line-strong); }
      .code-copy[data-ok] {
        opacity: 1;
        color: var(--ok-green);
        border-color: color-mix(in oklab, var(--ok-green) 45%, var(--code-border));
      }
      @media (hover: none) { .code-copy { opacity: 0.66; } }
      .tok-keyword { color: var(--syn-keyword); }
      .tok-string { color: var(--syn-string); }
      .tok-number { color: var(--syn-number); }
      .tok-comment { color: var(--syn-comment); font-style: italic; }
      .tok-macro { color: var(--accent); font-weight: 600; }
      article blockquote {
        margin: 1.25rem 0; padding: 0.3rem 0 0.3rem 1rem;
        border-left: 2px solid var(--accent); color: var(--fg-muted);
      }
      article table {
        width: 100%; border-collapse: collapse; margin: 1.25rem 0;
        font-size: 0.82rem; display: block; overflow-x: auto;
      }
      article th, article td {
        border: 1px solid var(--line); padding: 0.45rem 0.65rem; text-align: left; vertical-align: top;
      }
      article th { color: var(--fg-subtle); font-weight: 600; }
      article hr { border: none; border-top: 1px solid var(--line); margin: 2.5rem 0; }
      .doc-status { color: var(--fg-subtle); padding: 2rem 0; }

      .site-footer {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding-block: 1.25rem 2.5rem;
        color: var(--fg-subtle);
        font-size: 0.6875rem;
      }
      @media (prefers-reduced-motion: reduce) { *, .mesh { transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <canvas class="mesh" aria-hidden="true" data-mesh></canvas>

    <header class="site-header wrap">
      <p class="brand">
        <a class="brand-link" href="https://escaliba.net">
          <svg class="brand-sword" viewBox="0 0 16 16" width="17" height="17" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="14" y="1" width="1" height="1" fill="#f1efe9"/><rect x="13" y="2" width="1" height="1" fill="#f1efe9"/><rect x="14" y="2" width="1" height="1" fill="#8d8a82"/><rect x="12" y="3" width="1" height="1" fill="#f1efe9"/><rect x="13" y="3" width="1" height="1" fill="#8d8a82"/><rect x="11" y="4" width="1" height="1" fill="#f1efe9"/><rect x="12" y="4" width="1" height="1" fill="#8d8a82"/><rect x="10" y="5" width="1" height="1" fill="#f1efe9"/><rect x="11" y="5" width="1" height="1" fill="#8d8a82"/><rect x="9" y="6" width="1" height="1" fill="#f1efe9"/><rect x="10" y="6" width="1" height="1" fill="#8d8a82"/><rect x="8" y="7" width="1" height="1" fill="#f1efe9"/><rect x="9" y="7" width="1" height="1" fill="#8d8a82"/><rect x="3" y="8" width="1" height="1" fill="#cfccc4"/><rect x="4" y="8" width="1" height="1" fill="#77746d"/><rect x="7" y="8" width="1" height="1" fill="#f1efe9"/><rect x="8" y="8" width="1" height="1" fill="#8d8a82"/><rect x="4" y="9" width="1" height="1" fill="#cfccc4"/><rect x="5" y="9" width="1" height="1" fill="#77746d"/><rect x="6" y="9" width="1" height="1" fill="#f1efe9"/><rect x="7" y="9" width="1" height="1" fill="#8d8a82"/><rect x="5" y="10" width="1" height="1" fill="#cfccc4"/><rect x="6" y="10" width="1" height="1" fill="#77746d"/><rect x="4" y="11" width="1" height="1" fill="#7a766e"/><rect x="6" y="11" width="1" height="1" fill="#cfccc4"/><rect x="7" y="11" width="1" height="1" fill="#77746d"/><rect x="3" y="12" width="1" height="1" fill="#7a766e"/><rect x="7" y="12" width="1" height="1" fill="#cfccc4"/><rect x="8" y="12" width="1" height="1" fill="#77746d"/><rect x="1" y="13" width="1" height="1" fill="#cfccc4"/><rect x="2" y="13" width="1" height="1" fill="#cfccc4"/><rect x="1" y="14" width="1" height="1" fill="#8d8a82"/><rect x="2" y="14" width="1" height="1" fill="#8d8a82"/>
          </svg>
          <span class="brand-name">basilisk <span class="brand-sub">docs</span></span>
        </a>
      </p>
      <nav class="site-nav" aria-label="Site links">
        <a href="../">playground</a>
        <a href="https://github.com/escaliba/basilisk">github</a>
      </nav>
    </header>

    <main class="wrap">
      <article id="doc"><p class="doc-status">loading documentation…</p></article>
    </main>

    <footer class="site-footer wrap">
      basilisk, an open-source Luau virtualizing obfuscator.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script type="module">
      const doc = document.getElementById("doc");
      const slug = (s) => s.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");

      const COPY_SVG =
        '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">' +
        '<path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" ' +
        'stroke-linejoin="round" d="M10.5 10.5h2a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v2' +
        'M3.5 5.5h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/></svg>';
      const TICK_SVG =
        '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">' +
        '<path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
        'stroke-linejoin="round" d="M3.5 8.5l3 3 6-7"/></svg>';

      const blocks = [];
      function renderSelections() {
        const sel = window.getSelection();
        const rects =
          sel && sel.rangeCount > 0 && !sel.isCollapsed
            ? [...sel.getRangeAt(0).getClientRects()].filter((r) => r.width > 0.5)
            : [];
        for (const b of blocks) {
          if (!rects.length) { b.layer.innerHTML = ""; continue; }
          const box = b.block.getBoundingClientRect();
          const pitch = parseFloat(getComputedStyle(b.pre).lineHeight) || 0;
          let html = "";
          for (const r of rects) {
            const cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
            if (cx < box.left || cx > box.right || cy < box.top || cy > box.bottom) continue;
            const h = pitch > 0 ? pitch : r.height;
            html +=
              '<div class="code-sel-rect" style="transform:translate(' +
              (r.left - box.left) + "px," + (cy - box.top - h / 2) + "px);width:" +
              r.width + "px;height:" + h + 'px"></div>';
          }
          b.layer.innerHTML = html;
        }
      }

      function enhance() {
        doc.querySelectorAll("pre").forEach((pre) => {
          const code = pre.querySelector("code") || pre;
          const block = document.createElement("div");
          block.className = "code-block";
          pre.parentNode.insertBefore(block, pre);
          const layer = document.createElement("div");
          layer.className = "code-sel";
          layer.setAttribute("aria-hidden", "true");
          block.appendChild(layer);
          block.appendChild(pre);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "code-copy";
          btn.setAttribute("aria-label", "Copy code");
          btn.innerHTML = COPY_SVG;
          btn.addEventListener("click", async () => {
            if (btn.dataset.ok) return;
            const text = code.textContent;
            try {
              await navigator.clipboard.writeText(text);
            } catch (_) {
              const r = document.createRange();
              r.selectNodeContents(code);
              const s = window.getSelection();
              s.removeAllRanges(); s.addRange(r);
              try { document.execCommand("copy"); } catch (_e) {}
              s.removeAllRanges();
            }
            btn.dataset.ok = "1";
            btn.innerHTML = TICK_SVG;
            setTimeout(() => { delete btn.dataset.ok; btn.innerHTML = COPY_SVG; }, 1400);
          });
          block.appendChild(btn);
          pre.addEventListener("scroll", renderSelections, { passive: true });
          blocks.push({ block, pre, layer });
        });
        document.addEventListener("selectionchange", renderSelections);
        window.addEventListener("resize", renderSelections);
      }

      fetch("./MACROS.md")
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(async (md) => {
          doc.innerHTML = marked.parse(md);
          const seen = {};
          doc.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((h) => {
            let id = slug(h.textContent);
            if (seen[id]) id = id + "-" + ++seen[id];
            else seen[id] = 1;
            h.id = id;
          });
          try {
            const mod = await import("../editor.js");
            if (mod && typeof mod.highlight === "function") {
              doc.querySelectorAll("pre code").forEach((code) => {
                const lang = (code.className.match(/language-(\w+)/) || [])[1];
                if (!lang || lang === "lua" || lang === "luau") code.innerHTML = mod.highlight(code.textContent);
              });
            }
          } catch (_) {}
          enhance();
          if (location.hash) {
            const t = document.getElementById(location.hash.slice(1));
            if (t) t.scrollIntoView();
          }
        })
        .catch(() => {
          doc.innerHTML =
            '<p class="doc-status">The documentation could not be loaded here. Read it on ' +
            '<a href="https://github.com/escaliba/basilisk/blob/main/docs/MACROS.md">GitHub</a>.</p>';
        });
    </script>
    <script type="module" src="../mesh.js"></script>
  </body>
</html>

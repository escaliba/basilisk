<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>basilisk playground</title>
    <meta name="description" content="Try the Basilisk Luau virtualizing obfuscator in your browser. The real engine, compiled to WebAssembly, runs entirely client-side." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas class="mesh" aria-hidden="true" data-mesh></canvas>

    <header class="site-header wrap">
      <p class="brand">
        <a class="brand-link" href="https://escaliba.net">
          <svg class="brand-sword" viewBox="0 0 16 16" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="14" y="1" width="1" height="1" fill="#f1efe9"/><rect x="13" y="2" width="1" height="1" fill="#f1efe9"/><rect x="14" y="2" width="1" height="1" fill="#8d8a82"/><rect x="12" y="3" width="1" height="1" fill="#f1efe9"/><rect x="13" y="3" width="1" height="1" fill="#8d8a82"/><rect x="11" y="4" width="1" height="1" fill="#f1efe9"/><rect x="12" y="4" width="1" height="1" fill="#8d8a82"/><rect x="10" y="5" width="1" height="1" fill="#f1efe9"/><rect x="11" y="5" width="1" height="1" fill="#8d8a82"/><rect x="9" y="6" width="1" height="1" fill="#f1efe9"/><rect x="10" y="6" width="1" height="1" fill="#8d8a82"/><rect x="8" y="7" width="1" height="1" fill="#f1efe9"/><rect x="9" y="7" width="1" height="1" fill="#8d8a82"/><rect x="3" y="8" width="1" height="1" fill="#cfccc4"/><rect x="4" y="8" width="1" height="1" fill="#77746d"/><rect x="7" y="8" width="1" height="1" fill="#f1efe9"/><rect x="8" y="8" width="1" height="1" fill="#8d8a82"/><rect x="4" y="9" width="1" height="1" fill="#cfccc4"/><rect x="5" y="9" width="1" height="1" fill="#77746d"/><rect x="6" y="9" width="1" height="1" fill="#f1efe9"/><rect x="7" y="9" width="1" height="1" fill="#8d8a82"/><rect x="5" y="10" width="1" height="1" fill="#cfccc4"/><rect x="6" y="10" width="1" height="1" fill="#77746d"/><rect x="4" y="11" width="1" height="1" fill="#7a766e"/><rect x="6" y="11" width="1" height="1" fill="#cfccc4"/><rect x="7" y="11" width="1" height="1" fill="#77746d"/><rect x="3" y="12" width="1" height="1" fill="#7a766e"/><rect x="7" y="12" width="1" height="1" fill="#cfccc4"/><rect x="8" y="12" width="1" height="1" fill="#77746d"/><rect x="1" y="13" width="1" height="1" fill="#cfccc4"/><rect x="2" y="13" width="1" height="1" fill="#cfccc4"/><rect x="1" y="14" width="1" height="1" fill="#8d8a82"/><rect x="2" y="14" width="1" height="1" fill="#8d8a82"/>
          </svg>
          <span class="brand-name">basilisk <span class="brand-sub">playground</span></span>
        </a>
      </p>
      <nav class="site-nav" aria-label="Project links">
        <a href="https://github.com/escaliba/basilisk">github</a>
        <a href="docs/">docs</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="config" aria-label="Build configuration">
        <div class="crow">
          <span class="crow-key">transforms</span>
          <div class="crow-val">
            <label class="toggle"><input type="checkbox" id="opt-flatten" checked /><span>flatten</span></label>
            <label class="toggle"><input type="checkbox" id="opt-opaque" checked /><span>opaque</span></label>
            <label class="toggle"><input type="checkbox" id="opt-junk" /><span>junk</span></label>
            <label class="toggle"><input type="checkbox" id="opt-fuse" checked /><span>fuse</span></label>
            <label class="toggle"><input type="checkbox" id="opt-minify" checked /><span>minify</span></label>
            <label class="toggle"><input type="checkbox" id="opt-compress" /><span>compress</span></label>
          </div>
        </div>

        <div class="crow">
          <span class="crow-key">preset</span>
          <div class="crow-val">
            <button type="button" class="chip" data-preset="minimal">minimal</button>
            <button type="button" class="chip" data-preset="balanced">balanced</button>
            <button type="button" class="chip" data-preset="maximum">maximum</button>
          </div>
        </div>

        <div class="crow">
          <span class="crow-key">shell</span>
          <div class="crow-val">
            <select id="shell" class="select">
              <option value="default">default (iife)</option>
              <option value="setmeta">setmetatable</option>
              <option value="table-entry">table-entry</option>
              <option value="helper-launcher">helper-launcher</option>
            </select>
            <span class="crow-inline">seed</span>
            <input type="number" id="seed" class="input input--seed" value="1" min="0" step="1" />
            <button type="button" class="chip chip--icon" id="rand-seed" title="Randomize seed" aria-label="Randomize seed">&#8635;</button>
          </div>
        </div>

        <div class="crow">
          <span class="crow-key">load</span>
          <div class="crow-val crow-val--loads">
            <select id="sample" class="select"></select>
            <select id="macro" class="select"></select>
          </div>
        </div>
      </section>

      <section class="editors">
        <figure class="pane">
          <figcaption class="pane-head">
            <span class="pane-key">input <span class="pane-sub">luau</span></span>
          </figcaption>
          <div id="input-editor"></div>
        </figure>

        <figure class="pane">
          <figcaption class="pane-head">
            <span class="pane-key">output <span class="pane-sub">protected</span></span>
            <span class="pane-actions">
              <button type="button" class="chip" id="copy" aria-label="Copy output">copy</button>
              <button type="button" class="chip" id="dl-lua">download</button>
            </span>
          </figcaption>
          <div id="output-editor"></div>
          <div id="error-panel" class="error-panel" role="alert" hidden></div>
        </figure>
      </section>

      <section class="actionbar">
        <button type="button" id="run" class="btn-primary">obfuscate</button>
        <button type="button" id="clear" class="chip chip--btn">reset</button>
        <span class="run-hint">or <kbd>ctrl</kbd>/<kbd>&#8984;</kbd>+<kbd>enter</kbd></span>
        <dl class="stats" aria-label="Statistics">
          <div><dt>in</dt><dd id="stat-in">·</dd></div>
          <div><dt>out</dt><dd id="stat-out">·</dd></div>
          <div><dt>ratio</dt><dd id="stat-ratio">·</dd></div>
          <div><dt>time</dt><dd id="stat-time">·</dd></div>
          <div><dt>seed</dt><dd id="stat-seed">·</dd></div>
        </dl>
      </section>
    </main>

    <footer class="site-footer wrap">
      <span id="engine-version">engine loading…</span>
      <span class="foot-note">runs client-side, nothing is uploaded</span>
    </footer>

    <script type="module" src="./mesh.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>

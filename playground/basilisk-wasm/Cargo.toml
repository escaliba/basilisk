[package]
name = "basilisk-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly facade over the public Basilisk engine for the browser playground."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pipeline = { path = "../../crates/pipeline", default-features = false }
surface = { path = "../../crates/surface" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

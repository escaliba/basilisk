[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["playground"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
description = "Basilisk: a Rust-based Luau virtualizing obfuscator."
license = "MIT"
repository = "https://github.com/escaliba/basilisk"

[workspace.dependencies]
ir = { path = "crates/ir" }
bytecode = { path = "crates/bytecode" }
frontend = { path = "crates/frontend" }
passes = { path = "crates/passes" }
vmgen = { path = "crates/vmgen" }
pipeline = { path = "crates/pipeline" }
surface = { path = "crates/surface" }
full_moon = { version = "2.2", features = ["luau"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
